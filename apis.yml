aid: food-and-drug-administration
name: Food and Drug Administration
description: >-
  openFDA is an Elasticsearch-based public API that serves FDA data on drugs, devices, foods, animal/veterinary
  products, and tobacco. Each noun exposes one or more datasets including adverse events, recall enforcement reports,
  product labeling, classifications, registrations, and approvals.
